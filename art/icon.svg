<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fcd34d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- The lit tablet -->
  <ellipse cx="128" cy="124" rx="124" ry="96" fill="url(#glow)"/>
  <rect x="40" y="64" width="176" height="120" rx="20" fill="#ffffff"/>
  <rect x="50" y="74" width="156" height="100" rx="10" fill="url(#screen)"/>
  <circle cx="128" cy="69" r="2.5" fill="#cbd5e1"/>

  <!-- Sound reaching the microphone -->
  <g fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round">
    <path d="M90.3 140.4 A46 46 0 0 1 90.3 87.6"/>
    <path d="M165.7 87.6 A46 46 0 0 1 165.7 140.4"/>
    <path d="M73.7 147.9 A64 64 0 0 1 73.7 80.1"/>
    <path d="M182.3 80.1 A64 64 0 0 1 182.3 147.9"/>
  </g>

  <!-- Microphone -->
  <rect x="114" y="86" width="28" height="46" rx="14" fill="#1e3a8a"/>
  <g fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round">
    <path d="M98 114 A30 30 0 0 0 158 114"/>
    <line x1="128" y1="144" x2="128" y2="156"/>
    <line x1="114" y1="158" x2="142" y2="158"/>
  </g>
</svg>
